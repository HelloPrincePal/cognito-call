name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Extension Version
        id: version
        run: |
          VERSION=$(jq -r '.version' packages/extension/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building extension zip version: $VERSION"

      - name: Package Extension ZIP
        run: |
          cd packages/extension
          zip -r "../../cognito-call-v${VERSION}.zip" . -x "*.DS_Store"
          zip -r "../../cognito-call-extension.zip" . -x "*.DS_Store"
          cd ../..

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            cognito-call-v${{ steps.version.outputs.version }}.zip
            cognito-call-extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Share the extension zip with the desktop job so it can attach it to
      # the desktop release — this ensures /releases/latest/ always resolves
      # to a release that carries cognito-call-extension.zip, regardless of
      # which release stream (v* or desktop-v*) was published most recently.
      - name: Upload Extension ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognito-call-extension
          path: cognito-call-extension.zip
          retention-days: 1

  build-desktop-mac:
    runs-on: macos-latest
    needs: build-and-release
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Desktop App Version
        id: appversion
        run: |
          VERSION=$(jq -r '.version' cognito-desktop/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Desktop app version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Desktop Dependencies
        run: |
          cd cognito-desktop
          npm install

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'cognito-desktop'
          # Desktop app is versioned independently of the extension: derive its release
          # tag/name from the app's own version (tauri.conf.json), not the manifest.
          tagName: desktop-v${{ steps.appversion.outputs.version }}
          releaseName: 'Cognito Call Desktop v${{ steps.appversion.outputs.version }}'
          releaseBody: 'Cognito Call local AI desktop application bundle for macOS.'
          releaseDraft: false
          prerelease: false

      # Download the extension zip built by the build-and-release job and attach
      # it to this desktop release too. This means /releases/latest/ will always
      # resolve to a release that has the extension asset, no matter which release
      # stream was published most recently.
      - name: Download Extension ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: cognito-call-extension

      - name: Attach Extension ZIP to Desktop Release
        run: |
          VERSION=${{ steps.appversion.outputs.version }}
          gh release upload "desktop-v${VERSION}" cognito-call-extension.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
